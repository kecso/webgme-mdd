<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webgme-mdd — Mermaid diagram catalog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand">
          <p class="brand-mark">webgme-mdd</p>
          <p class="brand-sub">Mermaid → WebGME metamodels</p>
        </div>
        <label class="search">
          <span>Filter</span>
          <input id="filter" type="search" placeholder="diagram, domain, keyword…" autocomplete="off" />
        </label>
        <div class="status-filters" id="statusFilters"></div>
        <nav class="list" id="diagramList" aria-label="Diagrams"></nav>
      </aside>
      <main class="stage" id="stage">
        <header class="hero">
          <p class="eyebrow">Findings browser</p>
          <h1>All current Mermaid diagram families, packaged for WebGME</h1>
          <p class="lede">
            Browse syntax capabilities, target domains, and draft <code>Language.json</code>
            metamodels ready for webgme-json import.
          </p>
          <div class="stats" id="stats"></div>
        </header>
        <section class="detail empty" id="detail">
          <p>Select a diagram to inspect its META draft, domains, and sample.</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
